name: check

# nix flake check runs everything this repo has to prove: the formatter check,
# the gate's own fixture-based self-tests (the correctness proof this repo
# relies on — see README.md), the projector's determinism check, and the gate
# over this repo's own design layer, which holds its rendered PDF and its
# generated folder contracts to their Typst source. One job, one command,
# matching exactly what a contributor runs locally.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check
